<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notas Musicales UNO</title>
<style>
/* =========================================
   PROPIEDAD PERSONALIZADA PARA ANIMACIÓN
========================================= */
@property --angulo {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

*{
  box-sizing: border-box;
}

body{
  margin: 0;
  padding: 10px;
  background: #f0f0f0;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1{
  color: #333;
  font-size: 24px;
  margin: 10px 0;
}

textarea{
  width: 85%;
  max-width: 600px;
  height: 70px;
  font-size: 16px;
  padding: 10px;
  border-radius: 10px;
  border: 2px solid #999;
  resize: none;
}

.controles, .botones{
  margin: 5px 0;
}

select, label{
  padding: 8px;
  font-size: 16px;
  border-radius: 10px;
  margin: 5px;
  display: inline-block;
}

button{
  margin: 5px;
  padding: 10px 18px;
  border: none;
  border-radius: 12px;
  background: #ff3b3b;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover{
  background: #d90000;
}

.contenedor{
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 15px;
  padding-bottom: 20px;
}

/* =========================================
   CARTA Y SOMBRA 3X MÁS GRUESA
========================================= */
.carta{
  width: 240px;
  height: 340px;
  max-width: 65vw;
  max-height: 50vh;
  border-radius: 25px; /* Radio base de la carta */
  background: white;
  border: 6px solid #ddd;
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.6);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  font-weight: bold;
  padding: 20px;
  overflow: hidden;
  cursor: pointer;
}

/* =========================================
   MARCO ILUMINADO (RADIO CORREGIDO: 43px)
========================================= */
.carta::before{
  content: "";
  position: absolute;
  inset: -18px;
  padding: 38px;
  /* Radio proporcional perfecto: 25px (carta) + 18px (grosor) = 43px */
  border-radius: 43px;

  /* Gradiente cónico animado */
  background: conic-gradient(
    from -90deg,
    #2ecc71 var(--angulo),
    #00ff66 var(--angulo),
    transparent var(--angulo)
  );

  /* Máscara para recortar el interior y dejar solo el marco */
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;

  /* Animación sincronizada con el selector de tiempo */
  animation: relojMarco var(--duracion) linear forwards;
  z-index: 20;
  pointer-events: none;
}

/* =========================================
   ANIMACIÓN CON RESPLANDOR
========================================= */
@keyframes relojMarco{
  0%{
    --angulo: 0deg;
    filter: drop-shadow(0 0 12px #2ecc71);
  }
  100%{
    --angulo: 360deg;
    filter: drop-shadow(0 0 30px #00ff66);
  }
}

.carta > *{
  position: relative;
  z-index: 30;
}

.esquina{
  position: absolute;
  font-size: 22px;
  color: #444;
  z-index: 40;
}

.arriba{
  top: 12px;
  left: 12px;
}

.abajo{
  bottom: 12px;
  right: 12px;
  transform: rotate(180deg);
}

.nota{
  font-size: 44px;
  margin-bottom: 10px;
}

.carta img{
  width: 100%;
  height: 60%;
  object-fit: contain;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<h1>🎵 Cartas de Notas Musicales 🎵</h1>

<textarea id="entrada">DO,RE,MI,FA</textarea>

<div class="controles">
  <label><b>Tiempo:</b></label>
  <select id="tiempo">
    <option value="3000">3 segundos</option>
    <option value="5000" selected>5 segundos</option>
    <option value="7000">7 segundos</option>
  </select>

  <label><b>Playlist:</b></label>
  <select id="cancion" onchange="cambiarCancion()">
    <option value="manual">✏ Manual</option>
  </select>
</div>

<div class="botones">
  <button onclick="iniciar()">▶ Iniciar</button>
  <button onclick="detener()">⏹ Detener</button>
</div>

<div class="contenedor" id="contenedor"></div>

<script>
const playlist = [
  {
    nombre: "HIMNO A LA ALEGRIA",
    notas: "SI,DO,RE,RE,DO,SI,LA,SOL,SOL,LA,SI,SI,LA,LA,SI,DO6,RE6,DO6,SI,LA,SOL,SOL,LA,SI,LA,SOL,SOL,LA,SI,SOL,LA,SI,DO6,SI,SOL,LA,SI,DO6,SI,LA,SOL,LA,RE,SI,DO6,RE6,RE6,DO6,SI,LA,SOL,SOL,LA,SI,LA,SOL,SOL"
  },
  {
    nombre: "YO SOY TU AMIGO FIEL",
    notas: "MI,SOL,MI,LA,SOL,MI,LA,DO6,LA,RE6,DO5,SOL,LA,LA,LA,LA,SOL,SI,SI,SI,DO6,LA,SI,SI,SI,DO6,LA,MI,SOL,RE,RE,MI,DO6,LA,SOL,DO6,DO6,DO6,DO6,LA,SOL,DO6,DO6,DO6"
  }
];

const diccionario = {
  DO:  { nombre: "DO",  imagen: "imagenes/piano/doctora.jpg" },
  RE:  { nombre: "RE",  imagen: "imagenes/piano/regalo.jpg" },
  MI:  { nombre: "MI",  imagen: "imagenes/piano/mimi.jpg" },
  FA:  { nombre: "FA",  imagen: "imagenes/piano/fantasma.jpg" },
  SOL: { nombre: "SOL", imagen: "imagenes/piano/sol.jpg" },
  LA:  { nombre: "LA",  imagen: "imagenes/piano/lapiz.jpg" },
  SI:  { nombre: "SI",  imagen: "imagenes/piano/sirena.jpg" },
  END:  { nombre: "felicidades",  imagen: "imagenes/piano/felicidades.jpg" }
  
  
};

let notas = [];
let indice = 0;
let intervalo = null;

function cargarPlaylist(){
  const select = document.getElementById("cancion");
  playlist.forEach((cancion, i) => {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = cancion.nombre;
    select.appendChild(option);
  });
}

function cambiarCancion(){
  const valor = document.getElementById("cancion").value;
  if(valor === "manual") return;
  document.getElementById("entrada").value = playlist[valor].notas;
}

function iniciar(){
  detener();
  const texto = document.getElementById("entrada").value+",END";
  notas = texto.split(",").map(n => n.trim()).filter(n => n);
  indice = 0;

  if(notas.length === 0) return;

  mostrar();

  const tiempo = parseInt(document.getElementById("tiempo").value);

  intervalo = setInterval(() => {
    indice++;
    if(indice >= notas.length){
      detener();
      return;
    }
    mostrar();
  }, tiempo);
}

function detener(){
  clearInterval(intervalo);
  intervalo = null;
}

function hablar(texto){
  const limpio = texto.replace(/\d+/g, "");
  speechSynthesis.cancel();
  const voz = new SpeechSynthesisUtterance(limpio);
  voz.lang = "es-ES";
  speechSynthesis.speak(voz);
}

function obtenerTextoVoz(clave){
  const match = clave.match(/^([A-Z]+)(\d+)?$/);
  const nota = match ? match[1] : clave;
  if(diccionario[nota] && diccionario[nota].imagen){
    const ruta = diccionario[nota].imagen;
    return ruta.substring(ruta.lastIndexOf("/")+1, ruta.lastIndexOf("."));
  }
  return nota;
}

function crearCarta(clave){
  const match = clave.match(/^([A-Z]+)(\d+)?$/);
  let nota = clave;
  let numero = "";

  if(match){
    nota = match[1];
    numero = match[2] || "";
  }

  const carta = document.createElement("div");
  carta.className = "carta";

  const tiempo = document.getElementById("tiempo").value;
  carta.style.setProperty("--duracion", tiempo + "ms");

  carta.innerHTML = `
    <div class="esquina arriba">${numero}</div>
    <div class="esquina abajo">${numero}</div>
    <div class="nota">${nota}</div>
  `;

  if(diccionario[nota] && diccionario[nota].imagen){
    const img = document.createElement("img");
    img.src = diccionario[nota].imagen;
    img.onerror = () => img.remove();
    carta.appendChild(img);
  }

  carta.onclick = () => hablar(obtenerTextoVoz(clave));

  return carta;
}

function mostrar(){
  const contenedor = document.getElementById("contenedor");
  contenedor.innerHTML = "";

  const clave = notas[indice];
  if(!clave) return;

  const carta = crearCarta(clave);
  contenedor.appendChild(carta);
  hablar(obtenerTextoVoz(clave));
}

cargarPlaylist();
</script>

</body>
</html>

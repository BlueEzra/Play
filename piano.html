<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Etiqueta crucial para que el diseño responsivo funcione en móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Notas Musicales UNO</title>

  <div class="mini-menu">
    <a href="index.html">Index</a>
    <a href="cuadro.html">Cuadro</a>
    <a href="teclado.html">Teclado</a>
    <a href="piano.html">Piano</a>
  </div>

  <style>
  body {
    margin: 0;
    padding: 10px;
    background: #f0f0f0;
    font-family: Arial, sans-serif;
    text-align: center;
    box-sizing: border-box;
  }

  /* Estilos para el menú responsivo */
  .mini-menu {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
  }

  .mini-menu a {
    padding: 6px 12px;
    background: #ddd;
    color: #333;
    text-decoration: none;
    border-radius: 5px;
    font-size: 14px;
  }

  h1 { 
    color: #333; 
    font-size: 24px;
    margin: 10px 0;
  }

  textarea {
    width: 90px;
    max-width: 600px;
    width: 85%;
    height: 70px;
    font-size: 16px;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid #999;
    box-sizing: border-box;
  }

  .controles {
    margin: 5px 0;
  }

  button {
    margin: 5px;
    padding: 10px 18px;
    border: none;
    border-radius: 12px;
    background: #ff3b3b;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background: #d90000;
  }

  select, label {
    padding: 8px;
    font-size: 16px;
    border-radius: 10px;
    margin: 5px;
    display: inline-block;
  }

  .contenedor {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 15px;
    padding-bottom: 20px;
  }

  /* --- CARTA RESPONSIVA INTELIGENTE --- */
  .carta {
    /* En PC se verá de su tamaño clásico */
    width: 240px;
    height: 340px;
    /* En móviles se auto-ajusta para no desbordar la pantalla */
    max-width: 65vw;
    max-height: 50vh; 
    
    border-radius: 25px;
    background: white;
    border: 6px solid #ddd;
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    position: relative;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    font-size: 44px;
    font-weight: bold;
    box-sizing: border-box;
    padding: 20px;
  }

  .esquina {
    position: absolute;
    font-size: 22px;
    color: #444;
  }

  .arriba { top: 12px; left: 12px; }
  .abajo { bottom: 12px; right: 12px; transform: rotate(180deg); }

  .carta img {
    width: 100%;
    height: 60%;
    object-fit: contain;
    margin-bottom: 10px;
  }

  /* --- AJUSTES ESPECÍFICOS PARA MÓVIL HORIZONTAL --- */
  @media (max-height: 500px) and (orientation: landscape) {
    h1 {
      font-size: 18px;
      margin: 5px 0;
    }
    textarea {
      height: 45px;
      font-size: 14px;
    }
    button, select, label {
      font-size: 14px;
      padding: 6px 12px;
      margin: 3px;
    }
    .contenedor {
      margin-top: 5px;
    }
    .carta {
      width: 180px;
      height: 230px;
      font-size: 32px;
      border-width: 4px;
    }
    .esquina {
      font-size: 16px;
    }
  }
  </style>
</head>

<body>

<h1>🎵 Cartas de Notas Musicales 🎵</h1>

<textarea id="entrada">DO , RE , MI , FA</textarea>

<div class="controles">
  <label><b>Tiempo:</b></label>
  <select id="tiempo">
    <option value="3000">3 segundos</option>
    <option value="5000" selected>5 segundos</option>
    <option value="7000">7 segundos</option>
  </select>

  <label><b>Playlist:</b></label>
  <select id="cancion" onchange="cambiarCancion()">
    <option value="manual">✏ Manual</option>
  </select>
</div>

<div>
  <button onclick="iniciar()">▶ Iniciar</button>
  <button onclick="detener()">⏹ Detener</button>
</div>

<div class="contenedor" id="contenedor"></div>

<script>

/////////////////////////////////////////////////
// PLAYLIST
/////////////////////////////////////////////////

const playlist = [
  {
    nombre: "HIMNO A LA ALEGRIA",
    notas: "SI,DO,RE,RE,DO,SI,LA,SOL,SOL,LA,SI,SI,LA,LA,SI,DO6,RE6,DO6,SI,LA,SOL,SOL,LA,SI,LA,SOL,SOL,LA,SI,SOL,LA,SI,DO6,SI,SOL,LA,SI,DO6,SI,LA,SOL,LA,RE,SI,DO6,RE6,RE6,DO6,SI,LA,SOL,SOL,LA,SI,LA,SOL,SOL,"
  },
  {
    nombre: "YO SOY TU AMIGO FIEL",
    notas: "MI,SOL,MI,LA,SOL,MI,LA,DO6,LA,RE6,DO5,SOL,LA,LA,LA,LA,SOL,SI,SI,SI,DO6,LA,SI,SI,SI,DO6,LA,MI,SOL,RE,RE,MI,DO6,LA,SOL,DO6,DO6,DO6,DO6,LA,SOL,DO6,DO6,DO6,"
  }
];
  
/////////////////////////////////////////////////
// DICCIONARIO
/////////////////////////////////////////////////

const diccionario = {
  DO:{nombre:"DO",imagen:"imagenes/piano/doctora.jpg"},
  RE:{nombre:"RE",imagen:"imagenes/piano/regalo.jpg"},
  MI:{nombre:"MI",imagen:"imagenes/piano/mimi.jpg"},
  FA:{nombre:"FA",imagen:"imagenes/piano/fantasma.jpg"},
  SOL:{nombre:"SOL",imagen:"imagenes/piano/sol.jpg"},
  LA:{nombre:"LA",imagen:"imagenes/piano/lapiz.jpg"},
  SI:{nombre:"SI",imagen:"imagenes/piano/sirena.jpg"}
};

/////////////////////////////////////////////////

let notas=[];
let indice=0;
let intervalo=null;

/////////////////////////////////////////////////
// CARGAR PLAYLIST
/////////////////////////////////////////////////

function cargarPlaylist(){

  const select = document.getElementById("cancion");

  playlist.forEach((cancion, i)=>{

    const option = document.createElement("option");

    option.value = i;

    option.textContent = cancion.nombre;

    select.appendChild(option);

  });
}

/////////////////////////////////////////////////
// CAMBIAR CANCIÓN
/////////////////////////////////////////////////

function cambiarCancion(){

  const val = document.getElementById("cancion").value;

  if(val === "manual") return;

  document.getElementById("entrada").value =
    playlist[val].notas;
}

/////////////////////////////////////////////////
// CONTROL
/////////////////////////////////////////////////

function iniciar(){

  detener();

  const texto = document.getElementById("entrada").value;

  notas = texto.split(",").map(n => n.trim()).filter(n => n);

  indice = 0;

  if(notas.length === 0) return;

  mostrar();

  const tiempo =
    parseInt(document.getElementById("tiempo").value);

  intervalo = setInterval(()=>{

    indice++;

    if(indice >= notas.length){
      detener();
      return;
    }

    mostrar();

  }, tiempo);
}

function detener(){
  clearInterval(intervalo);
}

/////////////////////////////////////////////////
// VOZ (SIN NÚMEROS)
/////////////////////////////////////////////////

function hablar(texto){

  const limpio = texto.replace(/\d+/g, "");

  speechSynthesis.cancel();

  const voz = new SpeechSynthesisUtterance(limpio);

  voz.lang = "es-ES";

  speechSynthesis.speak(voz);
}

/////////////////////////////////////////////////
// OBTENER NOMBRE DE LA IMAGEN DESDE LA CLAVE
/////////////////////////////////////////////////

function obtenerTextoVoz(clave) {
  const match = clave.match(/^([A-Z]+)(\d+)?$/);
  const nota = match ? match[1] : clave;

  if (diccionario[nota] && diccionario[nota].imagen) {
    const ruta = diccionario[nota].imagen;
    const nombreArchivo = ruta.substring(ruta.lastIndexOf('/') + 1, ruta.lastIndexOf('.'));
    return nombreArchivo;
  }
  return nota;
}

/////////////////////////////////////////////////
// CARTA TIPO UNO
/////////////////////////////////////////////////

function crearCarta(clave){

  const match = clave.match(/^([A-Z]+)(\d+)?$/);

  let nota = clave;
  let numero = "";

  if(match){
    nota = match[1];
    numero = match[2] || "";
  }

  const carta = document.createElement("div");
  carta.className = "carta";

  carta.innerHTML = `
    <div class="esquina arriba">${numero}</div>
    <div class="esquina abajo">${numero}</div>
    <div>${nota}</div>
  `;

  if(diccionario[nota] && diccionario[nota].imagen){

    const img = document.createElement("img");
    img.src = diccionario[nota].imagen;

    img.onerror = ()=>img.remove();

    carta.appendChild(img);
  }

  carta.onclick = ()=>hablar(obtenerTextoVoz(clave));

  return carta;
}

/////////////////////////////////////////////////
// MOSTRAR
/////////////////////////////////////////////////

function mostrar(){

  const cont = document.getElementById("contenedor");

  cont.innerHTML = "";

  const clave = notas[indice];

  if(!clave) return;

  cont.appendChild(crearCarta(clave));

  hablar(obtenerTextoVoz(clave));
}

/////////////////////////////////////////////////

cargarPlaylist();

</script>

</body>
</html>

  <title>Cuadrícula de Imágenes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 150px);
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .cell {
      border: 1px solid #ccc;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #f9f9f9;
      font-size: 18px;
      font-weight: bold;
      overflow: hidden;
    }

    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    select {
      padding: 8px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h2>Cuadrícula de Imágenes</h2>

<select id="categoria">
  <option value="comidas">Comida</option>
  <option value="actividades">Actividades</option>
  <option value="sentimientos">Sentimiento</option>
</select>

<div class="grid" id="grid"></div>

<script>
  const datos = {
    comidas: ["agua", "sandia", "fresa", "huevo","pollo","leche","tomate","aguacate"],
    actividades: ["jugar", "leer", "ver_tv", "dormir"],
    sentimientos: ["me_siento_feliz", "me_siento_enfermo", "me_siento_enojado", "me_siento_cansado"]
  };

  const grid = document.getElementById("grid");
  const select = document.getElementById("categoria");

  function render(categoria) {
    grid.innerHTML = "";

    const nombres = datos[categoria];

    nombres.forEach(nombre => {
      const cell = document.createElement("div");
      cell.className = "cell";

      const img = document.createElement("img");
      img.src = `imagenes/cuadro/${categoria}/${nombre}.jpg`;
      img.alt = nombre;

      img.onerror = () => {
        cell.textContent = nombre.toUpperCase();
      };

      img.onload = () => {
        cell.innerHTML = "";
        cell.appendChild(img);
      };

      cell.appendChild(img);

      cell.addEventListener("click", () => {
        hablar(nombre);
      });

      grid.appendChild(cell);
    });
  }

  select.addEventListener("change", (e) => {
    render(e.target.value);
  });

  function hablar(texto) {
    const utterance = new SpeechSynthesisUtterance(texto.replaceAll("_",""));
    utterance.lang = "es-ES";
    speechSynthesis.speak(utterance);
  }

  // inicial
  render(select.value);
</script>

</body>
</html>

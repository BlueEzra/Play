<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuadro de comunicación</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1 class="titulo">Cuadro de comunicación</h1>

  <div class="fila">
    <label for="categoria">V 0.004 Tipo:</label>
    <select id="categoria"></select>
  </div>

  <div class="grid" id="grid"></div>

  <script>

    const datos = {
      comidas: {
        nombre: "Comida",
        modo: "Quiero",
        elementos: ["cereal_con_leche","espagueti","hot_cakes","huevo","nuggets","papas_fritas",
					"pizza","pollo","quesadillas","sandwich","tacos","tamales"]
      },

      actividades: {
        nombre: "Actividades",
        modo: "Me gustaria",
        elementos: ["andar_en_bicicleta","construir","cuidar_a_una_mascota","dibujar",
					"dormir","escuchar_musica","hacer_ejercicio","hacer_romepcabezas","jugar_futbol",
					"jugar_juegos_de_mesa","regar_plantas","ver_tv"]
      },


      sentimientos: {
        nombre: "Sentimientos",
        modo: "Me siento",
        elementos: ["agradecido","asustado","curioso","emocionado","enojado","estresado",
					"feliz","solo","sorprendido","tranquila","triste","valiente"
		]
      },
	  escuela1: {
        nombre: "Escuela1",
        modo: "Maestra ",
        elementos: 	  ["donde_esta","estoy_enojado","estoy_feliz","estoy_triste",
					   "extraño_a_mi_familia","me_duele_el_estomago","me_siento_mal","necesito_ayuda",
					   "no_entiedno","quiero_agua","quiero_irme","quiero_ir_al_baño"]
      },
escuela2: {
        nombre: "Escuela2",
        modo: "Maestra ",
        elementos:

["quiero_jugar","quiero_mas_tarea","quiero_mis_papas","quiero_mi_cobija",
"tengop_miedo","tengo_calor","tengo_frio","tengo_hambre",
"tengo_sueño","te_quiero","todo_bien","ya_termine"]
}
    };

    const grid = document.getElementById("grid");

    const selectCategoria = document.getElementById("categoria");

    function cargarCategorias() {
      selectCategoria.innerHTML = "";
      Object.entries(datos).forEach(([clave, categoria]) => {
        const option = document.createElement("option");
        option.value = clave;
        option.textContent = categoria.nombre;
        selectCategoria.appendChild(option);
      });
    }

    function render(categoria) {
      grid.innerHTML = "";
      const datosCategoria = datos[categoria];
      const elementos = datosCategoria.elementos;
      const modo = datosCategoria.modo;
      elementos.forEach(elemento => {
        const cell = document.createElement("div");
        cell.className = "cell";
        const img = document.createElement("img");
        img.src = `./imagenes/cuadro/${categoria}/${elemento}.jpg`;
        img.alt = elemento;
        img.onerror = () => {
          cell.innerHTML = "";
          cell.textContent = obtenerTexto(elemento).toUpperCase();
        };
        img.onload = () => {
          cell.innerHTML = "";
          cell.appendChild(img);
        };

        cell.appendChild(img);

        cell.addEventListener("click", () => {
          const textoElemento = obtenerTexto(elemento);
          const frase = `${modo} ${textoElemento}`;
          hablar(frase);
        });

        grid.appendChild(cell);
      });
    }

    function obtenerTexto(texto) {      return texto.replaceAll("_", " ");    }

    selectCategoria.addEventListener("change", () => {      render(selectCategoria.value);    });

    function hablar(texto) {
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = "es-ES";
      utterance.rate = 0.9;
      speechSynthesis.speak(utterance);
    }

    cargarCategorias();
    selectCategoria.value = Object.keys(datos)[0];
    render(selectCategoria.value);
  </script>
</body>
</html>

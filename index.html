<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuadro de comunicación</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1 class="titulo">Cuadro de comunicación</h1>

  <div class="fila">
    <label for="categoria">V1 .002 Tipo:</label>
    <select id="categoria"></select>
  </div>

  <div class="grid" id="grid"></div>

  <script>

    const datos = {
      comidas: {
        nombre: "Comida",
        modo: "Quiero",
        elementos: ["cereal_con_leche","espagueti","hot_cakes","huevo","nuggets","papas_fritas",
					"pizza","pollo","quesadillas","sandwich","tacos","tamales"]
      },

      actividades: {
        nombre: "Actividades",
        modo: "Me gustaria",
        elementos: ["jugar","leer","ver_tv","dormir"]
      },


      sentimientos: {
        nombre: "Sentimientos",
        modo: "Me siento",
        elementos: ["feliz","enfermo","enojado","cansado"]
      }
    };

    const grid = document.getElementById("grid");

    const selectCategoria = document.getElementById("categoria");

    function cargarCategorias() {
      selectCategoria.innerHTML = "";
      Object.entries(datos).forEach(([clave, categoria]) => {
        const option = document.createElement("option");
        option.value = clave;
        option.textContent = categoria.nombre;
        selectCategoria.appendChild(option);
      });
    }

    function render(categoria) {
      grid.innerHTML = "";
      const datosCategoria = datos[categoria];
      const elementos = datosCategoria.elementos;
      const modo = datosCategoria.modo;
      elementos.forEach(elemento => {
        const cell = document.createElement("div");
        cell.className = "cell";
        const img = document.createElement("img");
        img.src = `./imagenes/cuadro/${categoria}/${elemento}.jpg`;
        img.alt = elemento;
        img.onerror = () => {
          cell.innerHTML = "";
          cell.textContent = obtenerTexto(elemento).toUpperCase();
        };
        img.onload = () => {
          cell.innerHTML = "";
          cell.appendChild(img);
        };

        cell.appendChild(img);

        cell.addEventListener("click", () => {
          const textoElemento = obtenerTexto(elemento);
          const frase = `${modo} ${textoElemento}`;
          hablar(frase);
        });

        grid.appendChild(cell);
      });
    }

    function obtenerTexto(texto) {      return texto.replaceAll("_", " ");    }

    selectCategoria.addEventListener("change", () => {      render(selectCategoria.value);    });

    function hablar(texto) {
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = "es-ES";
      utterance.rate = 0.9;
      speechSynthesis.speak(utterance);
    }

    cargarCategorias();
    selectCategoria.value = Object.keys(datos)[0];
    render(selectCategoria.value);
  </script>
</body>
</html>

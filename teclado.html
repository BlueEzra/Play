<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teclado Responsive</title>

<style>

body{
    font-family: Arial;
    background:#f2f2f2;
    margin-top:80px;
}

/* MENU */

.mini-menu{
    position:fixed;
    top:10px;
    right:10px;

    display:flex;
    gap:8px;

    padding:6px 10px;

    background:rgba(0,0,0,0.6);

    border-radius:10px;

    z-index:9999;
}

.mini-menu a{
    text-decoration:none;
    color:white;
    background:#3498db;
    padding:8px 12px;
    border-radius:6px;
}

/* TITULO */

h2{
    text-align:center;
}

/* PANTALLA */

#pantalla{
    width:95%;
    max-width:1000px;

    height:80px;

    margin:20px auto;

    display:block;

    text-align:center;

    font-size:30px;

    border-radius:10px;
    border:2px solid #999;

    box-shadow: inset 0 3px 6px rgba(0,0,0,0.2);
}

/* TECLADO */

#teclado{
    width:95%;
    max-width:1000px;
    margin:auto;
}

.fila{
    display:flex;
    justify-content:center;
    gap:6px;
    margin:6px 0;
}

button{

    flex:1;

    height:80px;

    font-size:24px;

    border:none;
    border-radius:10px;

    background:linear-gradient(#fff,#d9d9d9);

    box-shadow:0 5px #666;

    font-weight:bold;

    cursor:pointer;

    transition:0.1s;

    touch-action: manipulation;

    user-select:none;
}

button:active{
    transform:translateY(4px);
    box-shadow:0 1px #444;
}

/* ======================================
   📱 VERTICAL
====================================== */

@media (orientation: portrait){

    h2{
        font-size:42px;
    }

    #pantalla{
        height:120px;
        font-size:50px;
    }

    /* cada fila se parte en 2 */
    .fila{
        flex-wrap:wrap;
    }

    button{
        flex: 0 0 18%;
        height:110px;
        font-size:36px;
    }

    .mini-menu a{
        font-size:20px;
    }
}

/* ======================================
   💻 HORIZONTAL
====================================== */

@media (orientation: landscape){

    .fila{
        flex-wrap:nowrap;
    }

    button{
        height:80px;
        font-size:24px;
    }
}

</style>
</head>

<body>

<div class="mini-menu">
  <a href="index.html">Index</a>
  <a href="cuadro.html">Cuadro</a>
  <a href="teclado.html">Teclado</a>
</div>

<h2>Teclado</h2>

<input type="text" id="pantalla" readonly>

<div id="teclado"></div>

<script>

const letras = [

    ["Q","W","E","R","T","Y","U","I","O","P"],

    ["A","S","D","F","G","H","J","K","L","Ñ"],

    ["Z","X","C","V","B","N","M"],

    ["Limpiar,🧹","Espacio,␣","Eliminar,⌫","Leer,🔊"]
];

const contenedor = document.getElementById("teclado");

letras.forEach(fila => {

    const divFila = document.createElement("div");

    divFila.className = "fila";

    fila.forEach(letra => {

        const btn = document.createElement("button");

        if(letra.includes(",")){
            btn.textContent = letra.split(",")[1];
        }else{
            btn.textContent = letra;
        }

        btn.onclick = () => agregar(letra);

        divFila.appendChild(btn);
    });

    contenedor.appendChild(divFila);
});

function agregar(letra){

    const pantalla = document.getElementById("pantalla");

    if(letra.split(",")[0] == "Limpiar"){
        pantalla.value = "";
        return;
    }

    if(letra.split(",")[0] == "Eliminar"){
        pantalla.value = pantalla.value.slice(0,-1);
        return;
    }

    if(letra.split(",")[0] == "Leer"){

        const voz = new SpeechSynthesisUtterance(pantalla.value);

        voz.lang = "es-ES";

        speechSynthesis.speak(voz);

        return;
    }

    letra = (letra.split(",")[0] == "Espacio") ? " " : letra;

    pantalla.value += letra;
}

</script>

</body>
</html>

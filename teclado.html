<title>Teclado con Array</title>

<style>
    body {
        font-family: Arial;
        margin-top: 30px;
        background: #f2f2f2;
    }

    h2 {
        text-align: center;
    }

	#pantalla {
		width: 100%;
		max-width: 1000px;   /* 👈 mismo ancho que el teclado */
		height: 80px;        /* 👈 más equilibrado */
		font-size: 28px;
		margin: 20px auto;
		display: block;
		text-align: center;

		border-radius: 10px;
		border: 2px solid #999;
		background: white;

		box-shadow: inset 0 3px 6px rgba(0,0,0,0.2);

		letter-spacing: 2px;
	}

    #teclado {
        width: 100%;
        max-width: 1000px;
        margin: auto;
    }

    .fila {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin: 6px;
    }

    button {
        flex: 1;
        height: 80px;
        font-size: 20px;
        margin: 2px;
        cursor: pointer;

        /* estilo tipo tecla */
        background: linear-gradient(#ffffff, #d9d9d9);
        border: 2px solid #999;
        border-radius: 8px;
        box-shadow: 0 5px #666;
        transition: all 0.1s ease;
        font-weight: bold;
        user-select: none;
    }

    button:hover {
        background: linear-gradient(#fefefe, #cfcfcf);
    }

    button:active {
        transform: translateY(4px);
        box-shadow: 0 1px #444;
    }

    .especial {
        background: linear-gradient(red, darkred);
        color: white;
        border: 2px solid #800;
    }

    .leer {
        background: linear-gradient(green, darkgreen);
        color: white;
        border: 2px solid #060;
    }
</style>

</head>
<body>

<h2>Teclado</h2>

<input type="text" id="pantalla" readonly>

<div id="teclado"></div>

<script>
    const letras = [
        ["Q","W","E","R","T","Y","U","I","O","P"],
        ["A","S","D","F","G","H","J","K","L","Ñ"],
        ["Z","X","C","V","B","N","M"],
        ["Limpiar,🧹","Espacio,␣␣␣␣␣␣␣␣","Eliminar,⌫","Leer,🔊"]
    ];

    const contenedor = document.getElementById("teclado");

    letras.forEach(fila => {
        const divFila = document.createElement("div");
        divFila.className = "fila";
        fila.forEach(letra => {
            const btn = document.createElement("button");
			if (letra.includes(",")) 
				btn.textContent = letra.split(",")[1];
			else
				btn.textContent = letra;
            btn.onclick = () => agregar(letra);
            divFila.appendChild(btn);
        });
        contenedor.appendChild(divFila);
    });

    function agregar(letra) {
        if(letra.split(",")[0]=="Limpiar"){
            document.getElementById("pantalla").value ="";
            return
        }
        if(letra.split(",")[0]=="Eliminar"){
            document.getElementById("pantalla").value =  document.getElementById("pantalla").value.slice(0, -1);
            return;
        }
        if(letra.split(",")[0]=="Leer"){
            const voz = new SpeechSynthesisUtterance(document.getElementById("pantalla").value);
            voz.lang = "es-ES";
            speechSynthesis.speak(voz);
            return;
        }
        letra = (letra.split(",")[0] === "Espacio") ? " " : letra;
        document.getElementById("pantalla").value += letra;
    }
</script>
</body>

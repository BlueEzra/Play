<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teclado Responsive</title>

<style>

/* ======================================
   GENERAL
====================================== */

*{
    box-sizing:border-box;
}

body{

    font-family:Arial;

    background:#f2f2f2;

    margin:0;
    padding:0;

    overflow:hidden;
}

/* ======================================
   MENU
====================================== */

.mini-menu{

    position:fixed;

    top:5px;
    right:5px;

    display:flex;

    gap:5px;

    padding:5px 8px;

    background:rgba(0,0,0,0.6);

    border-radius:10px;

    z-index:9999;
}

.mini-menu a{

    text-decoration:none;

    color:white;

    background:#3498db;

    padding:5px 8px;

    border-radius:6px;

    font-size:12px;
}

/* ======================================
   TITULO
====================================== */

h2{

    text-align:center;

    margin:5px 0;

    font-size:24px;
}

/* ======================================
   PANTALLA
====================================== */

#pantalla{

    width:98%;

    height:50px;

    margin:5px auto;

    display:block;

    text-align:center;

    font-size:28px;

    border-radius:10px;

    border:2px solid #999;

    box-shadow: inset 0 3px 6px rgba(0,0,0,0.2);
}

/* ======================================
   TECLADO
====================================== */

#teclado{

    width:99vw;

    height:calc(100vh - 130px);

    margin:auto;

    display:flex;

    flex-direction:column;

    justify-content:center;
}

/* FILAS */

.fila{

    display:flex;

    justify-content:center;

    gap:4px;

    margin:2px 0;

    width:100%;
}

/* BOTONES */

button{

    flex:1;

    min-width:0;

    height:40px;

    font-size:20px;

    border:none;

    border-radius:8px;

    background:linear-gradient(#fff,#d9d9d9);

    box-shadow:0 3px #666;

    font-weight:bold;

    cursor:pointer;

    transition:0.1s;

    touch-action:manipulation;

    user-select:none;

    overflow:hidden;
}

button:active{

    transform:translateY(2px);

    box-shadow:0 1px #444;
}

/* ======================================
   📱 VERTICAL
====================================== */

@media (orientation: portrait){

    h2{
        font-size:30px;
    }

    #pantalla{

        height:60px;

        font-size:34px;
    }

    /* PARTIR FILAS */

    .fila{
        flex-wrap:wrap;
    }

    button{

        flex:0 0 18%;

        height:55px;

        font-size:28px;
    }

    .mini-menu a{

        font-size:16px;
    }
}

/* ======================================
   💻 HORIZONTAL
====================================== */

@media (orientation: landscape){

    .fila{
        flex-wrap:nowrap;
    }

    button{

        height:40px;

        font-size:20px;
    }
}

</style>

</head>

<body>

<!-- MENU -->

<div class="mini-menu">

  <a href="index.html">Index</a>

  <a href="cuadro.html">Cuadro</a>

  <a href="teclado.html">Teclado</a>

</div>

<h2>Teclado</h2>

<input type="text" id="pantalla" readonly>

<div id="teclado"></div>

<script>

const letras = [

    ["Q","W","E","R","T","Y","U","I","O","P"],

    ["A","S","D","F","G","H","J","K","L","Ñ"],

    ["Z","X","C","V","B","N","M"],

    ["Limpiar,🧹","Espacio,␣","Eliminar,⌫","Leer,🔊"]

];

const contenedor = document.getElementById("teclado");

/* CREAR TECLADO */

letras.forEach(fila => {

    const divFila = document.createElement("div");

    divFila.className = "fila";

    fila.forEach(letra => {

        const btn = document.createElement("button");

        if(letra.includes(",")){

            btn.textContent = letra.split(",")[1];

        }else{

            btn.textContent = letra;
        }

        btn.onclick = () => agregar(letra);

        divFila.appendChild(btn);
    });

    contenedor.appendChild(divFila);
});

/* FUNCIONES */

function agregar(letra){

    const pantalla = document.getElementById("pantalla");

    const accion = letra.split(",")[0];

    if(accion == "Limpiar"){

        pantalla.value = "";

        return;
    }

    if(accion == "Eliminar"){

        pantalla.value = pantalla.value.slice(0,-1);

        return;
    }

    if(accion == "Leer"){

        const voz = new SpeechSynthesisUtterance(pantalla.value);

        voz.lang = "es-ES";

        speechSynthesis.speak(voz);

        return;
    }

    letra = (accion == "Espacio") ? " " : letra;

    pantalla.value += letra;
}

</script>

</body>

</html>
